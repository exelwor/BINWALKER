[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binwalker"
version = "0.1.0"
description = "Static executable structure analyzer for ELF, PE, and Mach-O binaries — inspects headers, sections, imports, entropy, security mitigations, and metadata without execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["binwalker[server]", "pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
binwalker = "binwalker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binwalker = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
